<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SCC Auto-Login Setup</title>
    <style>
        @font-face {
            font-family: 'Lexend Deca';
            src: url('lexend-deca.ttf') format('truetype');
        }

        body {
            font-family: 'Lexend Deca', sans-serif;
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333333;
        }

        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 8px;
            color: #2c2c2c;
        }

        p.subtitle {
            font-size: 14px;
            color: #666666;
            margin-bottom: 24px;
        }

        input[type="email"] {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: 'Lexend Deca', sans-serif;
            font-size: 14px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="email"]:focus {
            border-color: #da251d;
        }

        button {
            width: 100%;
            background-color: #da251d;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-family: 'Lexend Deca', sans-serif;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #b81f18;
        }

        #status {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="scc_icon.png" alt="SCC Online Logo" class="logo">
        
        <h2>Auto-Login Setup</h2>
        <p class="subtitle">Enter your SCC Online account email below.</p>
        
        <input type="email" id="email" placeholder="e.g. researcher@example.com">
        
        <button id="save">Save Credentials</button>
        
        <div id="status" style="color: #10b981;"></div>
    </div>

    <script src="options.js"></script>
</body>
</html>
